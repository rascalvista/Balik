<!doctype html>
<html lang="cs" data-balik-floor="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BALÍČEK · 1 – Kuchyně</title>
  <script src="../assets/balik-progress.js?v=2"></script>
  <link rel="preload" href="art/courier-walk.webp" as="image">
  <link rel="stylesheet" href="../assets/game-name.css?v=2">
  <link rel="stylesheet" href="../assets/balik-ui.css?v=3">
  <link rel="stylesheet" href="../assets/elevator.css?v=2">
  <link rel="stylesheet" href="kuchyne.css?v=7">
  <script src="../assets/game-name.js" defer></script>
  <script src="../assets/balik-sound.js?v=3" defer></script>
  <script src="../assets/elevator.js?v=5" defer></script>
  <script src="audio.js?v=3" defer></script>
  <script src="kuchyne.js?v=9" defer></script>
  <script src="../assets/balik-menu.js?v=7" defer></script>
</head>
<body>
  <main class="game" data-floor="1">
    <header class="game-head">
      <button class="head-button" id="sound-toggle" type="button" aria-label="Zvuk"></button>
      <div class="game-heading">
        <div class="brand"><img src="../assets/brand-parcel.png" alt=""><span data-game-name>BALÍČEK</span></div>
        <h1><span>1</span> Kuchyně</h1>
      </div>
      <button class="head-button" id="balik-menu-toggle" type="button" aria-label="Menu"><span class="menu" aria-hidden="true"></span></button>
    </header>

    <section class="orders" aria-label="Objednávky">
      <div class="orders-heading"><h2>Objednávky</h2><span class="served"></span></div>
      <ul class="tickets"></ul>
    </section>

    <section class="kitchen" aria-label="Hotelová kuchyně">
      <span class="station" hidden></span>
      <span class="burner-focus" aria-hidden="true" hidden></span>
      <span class="plate-focus" aria-hidden="true" hidden></span>
      <span class="guide-target" aria-hidden="true" hidden></span>
      <div class="kitchen-effects"></div>
      <div class="kitchen-floor-cover" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <button class="cook" type="button" aria-label="Kuchtík – ukázat postup">
        <span class="cook-body"></span>
        <span class="carry-stack cook-carry" hidden><img class="held-plate" src="art/plate.png" alt="" hidden><img class="cook-food" alt=""></span>
      </button>
      <div class="actor" aria-label="Kurýr se žlutým batohem">
        <span class="player-sprite"></span>
        <span class="carry-stack" hidden><img class="held-plate" src="art/plate.png" alt="" hidden><img class="held" alt=""></span>
      </div>
      <button class="recipe-preview" type="button" aria-label="Otevřít obrázkový recept"></button>
      <div class="kitchen-lift" aria-hidden="true" hidden>
        <img src="art/lift-leaf-left.webp" alt=""><img src="art/lift-leaf-right.webp" alt="">
      </div>
      <button class="lift-return" type="button" aria-label="Otevřít panel výtahu" hidden></button>
      <span class="floor-button handoff" aria-hidden="true" hidden>2</span>
      <div class="stick" role="group" aria-label="Osmisměrný ovladač. Táhni palcem a uvolni pro zastavení.">
        <div class="stick-marks" aria-hidden="true"></div><span class="stick-cap" aria-hidden="true"></span>
      </div>
      <div class="burner-controls" role="group" aria-label="Výběr plotýnky" hidden></div>
      <button class="action" type="button" disabled><span class="action-glyph"></span><span class="action-label">Akce</span></button>
    </section>

    <footer class="status"><span class="status-name">Kurýr</span><span class="status-message" role="status">„Dobře. Ale vařím naposledy.“</span></footer>
    <button id="reset" type="button" hidden>Restartovat patro</button>
  </main>

  <dialog class="kitchen-dialog" id="kitchen-panel" aria-labelledby="panel-title">
    <h2 id="panel-title"></h2>
    <div class="panel-body"></div>
    <form method="dialog"><button class="panel-close">Zavřít</button></form>
  </dialog>
</body>
</html>
