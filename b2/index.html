<!doctype html>
<html lang="cs" data-balik-floor="B2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BALÍČEK | B2 – Garáže</title>
  <script src="../assets/balik-progress.js?v=3"></script>
  <link rel="stylesheet" href="../assets/elevator.css?v=2">
  <link rel="stylesheet" href="../assets/game-name.css?v=2">
  <link rel="stylesheet" href="../assets/balik-ui.css?v=3">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10171e;
      color: #e9d9b6;
      font: 16px/1.45 monospace;
    }
    main {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    .parking { position: relative; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #151d24;
      image-rendering: pixelated;
      touch-action: none;
      cursor: grab;
    }
    canvas.dragging { cursor: grabbing; }
    .courier-message {
      display: grid;
      grid-template-columns: clamp(40px, 12vw, 62px) 1fr;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      padding: 10px 12px;
      border: 1px solid #a7764a;
      border-radius: .5rem;
      background: #f2caa0;
      color: #2c2019;
      box-shadow: inset 0 0 0 1px #ffdfae;
      font-family: system-ui, sans-serif;
    }
    .message {
      margin: 0;
      font-size: clamp(14px, 2.8vw, 16px);
      line-height: 1.3;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #7d7156;
      border-radius: 4px;
      background: #28343e;
      color: #f2d38b;
      font: bold 15px/1.4 monospace;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible {
      outline: 2px solid #f2c65c;
      outline-offset: 3px;
    }
    .parking .floor-pickup {
      position: absolute;
      min-height: 0;
      padding: 0;
      border: 3px ridge var(--floor-button-rim);
      border-radius: 50%;
      background: var(--floor-button-brass);
      color: var(--floor-button-ink);
      font-size: clamp(11px, 3.4vw, 20px);
      box-shadow: 0 0 9px #ffca667f;
    }
    .parking .floor-pickup::before {
      position: absolute;
      content: "";
      inset: -8px;
    }
    .parking .elevator-entry {
      min-height: 0;
      padding: 0;
      border: 2px solid #f2c65c;
      border-radius: 3px;
      background: #f2c65c14;
    }
    .trunk {
      position: absolute;
      min-height: 0;
      padding: 0;
      border: 2px solid #f2c65c;
      border-radius: 3px;
      background: #f2c65c23;
      box-shadow: 0 0 12px #f2c65c7c;
    }
    .trunk::before {
      position: absolute;
      content: "";
      inset: -7px;
    }
    .garage-courier {
      position: absolute;
      left: 10.6%;
      bottom: 26.5%;
      width: 8.6%;
      aspect-ratio: 150/292;
    }
    [hidden] { display: none; }
  </style>
  <link rel="stylesheet" href="landscape.css?v=1" media="(orientation: landscape) and (min-width: 540px)">
  <script src="../assets/elevator.js?v=6" defer></script>
  <script src="../assets/balik-sound.js?v=3" defer></script>
  <script src="audio.js?v=3" defer></script>
  <script src="game.js?v=8" defer></script>
  <script src="../assets/game-name.js" defer></script>
  <script src="../assets/balik-menu.js?v=7" defer></script>
</head>
<body>
  <main data-floor="B2">
    <header class="floor-header">
      <button class="floor-control" id="sound-toggle" type="button" aria-label="Zvuk" aria-pressed="true" title="Ztlumit zvuk">🔈</button>
      <h1 class="floor-brand">
        <span class="game-brand game-brand--floor">
          <img class="game-brand-parcel" src="../assets/brand-parcel.png" width="120" height="101" alt="">
          <span class="game-brand-name" data-game-name>BALÍČEK</span>
        </span>
        <span class="floor-label">B2 – Garáže</span>
      </h1>
      <button class="floor-control" id="balik-menu-toggle" type="button" aria-label="Otevřít menu hry">☰</button>
    </header>
    <div class="parking">
      <canvas id="parking" width="450" height="338" aria-label="Parkovací rébus">
        Odsuň auta z dráhy červeného vozu a vyjeď s ním doleva.
      </canvas>
      <span class="courier courier-standing garage-courier" role="img" aria-label="Kurýr"></span>
      <button class="trunk" id="trunk" type="button" aria-label="Otevřít kufr" hidden></button>
      <button class="floor-button floor-pickup" id="pickup" type="button" aria-label="Vyzvednout tlačítko B1" hidden>B1</button>
      <button class="elevator-entry" id="elevator-entry" type="button" aria-label="Nastoupit do výtahu" hidden></button>
    </div>
    <div class="garage-briefing">
      <div class="courier-message">
        <span class="courier courier-portrait" aria-hidden="true"></span>
        <p class="message" id="message" data-dialogue-voice="courier" role="status"></p>
      </div>
      <div class="controls">
        <button id="undo" type="button" disabled>Zpět</button>
        <button id="reset" type="button">Reset</button>
        <span id="count">Tahů: 0</span>
      </div>
    </div>
  </main>
</body>
</html>
