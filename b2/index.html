<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BALÍČEK B2</title>
  <link rel="stylesheet" href="../assets/elevator.css?v=2">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10171e;
      color: #e9d9b6;
      font: 16px/1.45 monospace;
    }
    main {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 12px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      color: #e4bd60;
      font-size: clamp(21px, 4.8vw, 28px);
    }
    .parking { position: relative; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #151d24;
      image-rendering: pixelated;
      touch-action: none;
      cursor: grab;
    }
    canvas.dragging { cursor: grabbing; }
    .message {
      margin: 10px 0;
      padding: 10px 12px;
      background: #202a33;
      border-left: 4px solid #d6ac56;
      font-size: clamp(14px, 2.8vw, 16px);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #7d7156;
      border-radius: 4px;
      background: #28343e;
      color: #f2d38b;
      font: bold 15px/1.4 monospace;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible {
      outline: 2px solid #f2c65c;
      outline-offset: 3px;
    }
    .parking .floor-pickup {
      position: absolute;
      min-height: 0;
      padding: 0;
      border: 3px ridge var(--floor-button-rim);
      border-radius: 50%;
      background: var(--floor-button-brass);
      color: var(--floor-button-ink);
      font-size: clamp(11px, 3.4vw, 20px);
      box-shadow: 0 0 9px #ffca667f;
    }
    .parking .floor-pickup::before {
      position: absolute;
      content: "";
      inset: -8px;
    }
    .parking .elevator-entry {
      min-height: 0;
      padding: 0;
      border: 2px solid #f2c65c;
      border-radius: 3px;
      background: #f2c65c14;
    }
    .trunk {
      position: absolute;
      min-height: 0;
      padding: 0;
      border: 2px solid #f2c65c;
      border-radius: 3px;
      background: #f2c65c23;
      box-shadow: 0 0 12px #f2c65c7c;
    }
    .trunk::before {
      position: absolute;
      content: "";
      inset: -7px;
    }
    .sound-toggle {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      min-height: 0;
      padding: 0;
      border-radius: 7px;
      font: 16px/1 system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }
    .sound-toggle::before {
      content: "";
      position: absolute;
      inset: -6px;
    }
    .sound-toggle[aria-pressed="false"] { border-color: #515f6b; }
    .courier {
      position: absolute;
      left: 10.6%;
      top: 53.9%;
      width: 8.6%;
      aspect-ratio: 72/121;
      background: url("../assets/courier-sheet.jpg") no-repeat 97.101% 33.333% / 1537.5% 166.942%;
      image-rendering: pixelated;
      transform: scaleX(-1);
      clip-path: polygon(
        33.333% 1.653%, 63.889% 1.653%, 75% 7.438%, 79.167% 15.702%,
        77.778% 25.620%, 73.611% 32.231%, 90.278% 33.058%, 94.444% 38.017%,
        93.056% 46.281%, 94.444% 59.504%, 88.889% 65.289%, 73.611% 68.595%,
        69.444% 76.860%, 72.222% 88.430%, 66.667% 93.388%, 50% 95.041%,
        47.222% 95.868%, 37.5% 97.521%, 20.833% 96.694%, 20.833% 91.736%,
        26.389% 87.603%, 25% 77.686%, 27.778% 69.421%, 15.278% 71.074%,
        8.333% 66.942%, 9.722% 60.331%, 15.278% 54.545%, 18.056% 45.455%,
        26.389% 41.322%, 25% 36.364%, 20.833% 32.231%, 20.833% 25.620%,
        11.111% 25.620%, 6.944% 22.314%, 8.333% 18.182%, 22.222% 14.876%, 25% 7.438%
      );
      pointer-events: none;
    }
    [hidden] { display: none; }
  </style>
  <script src="../assets/elevator.js?v=2" defer></script>
  <script src="audio.js" defer></script>
  <script src="game.js?v=4" defer></script>
</head>
<body>
  <main>
    <header>
      <h1><span data-game-name>BALÍČEK</span> / B2</h1>
      <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Zvuk" aria-pressed="true" title="Ztlumit zvuk">🔈</button>
    </header>
    <div class="parking">
      <canvas id="parking" width="450" height="338" aria-label="Parkovací rébus">
        Odsuň auta z dráhy červeného vozu a vyjeď s ním doleva.
      </canvas>
      <span class="courier" role="img" aria-label="Kurýr"></span>
      <button class="trunk" id="trunk" type="button" aria-label="Otevřít kufr" hidden></button>
      <button class="floor-button floor-pickup" id="pickup" type="button" aria-label="Vyzvednout tlačítko B1" hidden>B1</button>
      <button class="elevator-entry" id="elevator-entry" type="button" aria-label="Nastoupit do výtahu" hidden></button>
    </div>
    <p class="message" id="message" role="status"></p>
    <div class="controls">
      <button id="undo" type="button" disabled>Zpět</button>
      <button id="reset" type="button">Reset</button>
      <span id="count">Tahů: 0</span>
    </div>
  </main>
</body>
<script src="../assets/game-name.js" defer></script><script src="../assets/balik-menu.js?v=4" defer></script></html>
