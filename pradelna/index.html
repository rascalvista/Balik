<!doctype html>
<html lang="cs" data-balik-floor="4">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BALÍČEK | 4 – Prádelna</title>
  <script src="../assets/balik-progress.js?v=6"></script>
  <link rel="stylesheet" href="../assets/game-name.css?v=2">
  <link rel="stylesheet" href="../assets/balik-ui.css?v=3">
  <link rel="stylesheet" href="../assets/elevator.css?v=2">
  <link rel="stylesheet" href="laundry.css?v=2">
  <link rel="preload" as="image" href="art/laundry.webp">
  <script src="../assets/game-name.js" defer></script>
  <script src="../assets/balik-sound.js?v=3" defer></script>
  <script src="../assets/elevator.js?v=7" defer></script>
  <script src="audio.js?v=1" defer></script>
  <script src="laundry.js?v=2" defer></script>
  <script src="../assets/balik-menu.js?v=7" defer></script>
</head>
<body>
  <main class="laundry-level" data-floor="4">
    <header class="floor-header">
      <button class="floor-control" id="sound-toggle" type="button" aria-label="Zvuk">🔈</button>
      <h1 class="floor-brand">
        <span class="game-brand game-brand--floor">
          <img src="../assets/brand-parcel.png" class="game-brand-parcel" width="120" height="101" alt="">
          <span class="game-brand-name" data-game-name>BALÍČEK</span>
        </span>
        <span class="floor-label">4 – Prádelna</span>
      </h1>
      <button class="floor-control" id="balik-menu-toggle" type="button" aria-label="Otevřít menu hry">☰</button>
    </header>

    <section class="laundry-progress" aria-label="Stav třídění">
      <strong id="set-label">Várka 1 / 7</strong>
      <span id="move-count">Tahů: 0</span>
    </section>

    <div class="laundry-room">
      <div class="laundry-board" role="group" aria-label="Koše s ručníky"></div>
    </div>

    <div class="laundry-dialogue">
      <span class="courier courier-portrait" aria-hidden="true"></span>
      <p id="laundry-line" role="status" data-dialogue-voice="courier"></p>
    </div>

    <div class="laundry-controls">
      <button type="button" id="undo-sort" disabled>Zpět o tah</button>
      <button type="button" id="reset-set">Znovu várku</button>
      <button type="button" class="laundry-primary" id="next-set" hidden>Další várka</button>
    </div>

    <button id="reset" type="button" hidden>Restartovat patro</button>
  </main>
</body>
</html>
