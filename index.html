rn im});function flow(){let s=map.get('0,4'),end=map.get('5,0'),seen=new Set(),q=[];if(a[s]&4){seen.add(s);q.push(s)}while(q.length){let i=q.shift(),[x,y]=cells[i];dirs.forEach(([dx,dy],j)=>{let n=map.get([x+dx,y+dy].join(','));if((a[i]&(1<<j))&&n!==undefined&&(a[n]&(1<<((j+2)%4)))&&!seen.has(n)){seen.add(n);q.push(n)}})}return {seen,win:seen.has(end)&&!!(a[end]&1)}}
function render() {
  const connection = flow();
  tiles.forEach((image, index) => {
    image.src = sprites[a[index] + '-' + Number(connection.seen.has(index))];
  });
  if (!connection.win || phase) return;

  phase = 1;
  const currentRun = epoch;
  const gauge = $('gauge');
  const serviceCase = $('case');
  $('dialog').textContent = '„Tak, a teď trochu tlaku…“';
  document.querySelector('main').classList.add('running');
  let pressure = 0;

  function tick() {
    if (currentRun !== epoch) return;
    pressure += 2;
    $('pressure').textContent = pressure + ' %';
    gauge.style.setProperty('--needle-angle', (140 + pressure * 1.5) + 'deg');
    if (pressure === 68) gauge.classList.add('trembling');

    if (pressure < 150) {
      setTimeout(tick, 32);
      return;
    }

    serviceCase.className = 'hot case burst';
    setTimeout(() => {
      if (currentRun !== epoch) return;
      phase = 2;
      gauge.classList.remove('trembling');
      for (let index = 0; index < 22; index++) {
        const shard = document.createElement('i');
        shard.className = 'shard';
        shard.style.setProperty('--x', ((index % 7 - 3) * 23) + 'px');
        shard.style.setProperty('--y', (35 + index * 7) + 'px');
        $('fx').append(shard);
      }
      serviceCase.className = 'hot case open ready';
      serviceCase.textContent = '';
      $('dialog').textContent = '„Doufám, že to nebylo na fakturu. Rychle, tlačítko!“';
    }, 850);
  }

  tick();
}

function reset() {
  epoch++;
  phase = 0;
  a = initial.slice();
  const serviceCase = $('case');
  const gauge = $('gauge');
  serviceCase.className = 'hot case';
  serviceCase.textContent = '';
  serviceCase.style.pointerEvents = '';
  $('pressure').textContent = '0 %';
  gauge.style.removeProperty('--needle-angle');
  gauge.classList.remove('trembling');
  $('fx').innerHTML = '';
  $('doors').className = '';
  document.querySelector('main').classList.remove('running');
  $('done').hidden = true;
  $('dialog').textContent = '„Tlačítko do přízemí je v zamčené schránce. Klíč nikde. Ale támhle je čerpadlo… Snad má správce pojištění. Já fakt strašně spěchám!“';
  render();
}
