<!doctype html>
<html lang="cs" data-balik-floor="5">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BALÍČEK | 5 – Bazén</title>
  <script src="../assets/balik-progress.js?v=5"></script>
  <link rel="stylesheet" href="../assets/game-name.css?v=2">
  <link rel="stylesheet" href="../assets/balik-ui.css?v=3">
  <link rel="stylesheet" href="../assets/elevator.css?v=2">
  <link rel="stylesheet" href="pool.css?v=1">
  <link rel="preload" as="image" href="art/pool.webp">
  <link rel="preload" as="image" href="art/swimmer.webp">
  <script src="../assets/game-name.js" defer></script>
  <script src="../assets/balik-sound.js?v=3" defer></script>
  <script src="../assets/elevator.js?v=7" defer></script>
  <script src="audio.js?v=1" defer></script>
  <script src="pool.js?v=2" defer></script>
  <script src="../assets/balik-menu.js?v=7" defer></script>
</head>
<body>
  <main class="pool-level" data-floor="5">
    <header class="floor-header">
      <button class="floor-control" id="sound-toggle" type="button" aria-label="Zvuk">🔈</button>
      <h1 class="floor-brand">
        <span class="game-brand game-brand--floor">
          <img src="../assets/brand-parcel.png" class="game-brand-parcel" width="120" height="101" alt="">
          <span class="game-brand-name" data-game-name>BALÍČEK</span>
        </span>
        <span class="floor-label">5 – Bazén</span>
      </h1>
      <button class="floor-control" id="balik-menu-toggle" type="button" aria-label="Otevřít menu hry">☰</button>
    </header>

    <section class="course" aria-label="Stav dráhy">
      <strong id="course-label">Dráha 1 / 6</strong>
      <span id="move-count">Tahů: 0</span>
    </section>

    <div class="pool-scene">
      <div class="pool-grid" role="group" aria-label="Dráha v bazénu">
        <div class="pool-tiles"></div>
        <div class="pool-tokens" aria-hidden="true"></div>
      </div>
    </div>

    <div class="pool-dialogue">
      <span class="courier courier-portrait" aria-hidden="true"></span>
      <p id="pool-line" role="status" data-dialogue-voice="courier"></p>
    </div>

    <div class="pool-controls">
      <div class="pool-steering">
        <div class="pool-dpad" role="group" aria-label="Pohyb kurýra">
          <button type="button" data-move="up" aria-label="Vzhůru"></button>
          <button type="button" data-move="left" aria-label="Doleva"></button>
          <button type="button" data-move="down" aria-label="Dolů"></button>
          <button type="button" data-move="right" aria-label="Doprava"></button>
        </div>
        <button class="pool-action" type="button" data-move="wait">Počkat</button>
      </div>
      <div class="pool-tools">
        <button type="button" id="undo-turn">Zpět o tah</button>
        <button type="button" id="reset-course">Znovu dráhu</button>
      </div>
      <button class="pool-action pool-next" type="button" id="next-course" hidden>Další dráha</button>
    </div>
    <button id="reset" type="button" hidden>Restartovat patro</button>
  </main>

  <dialog id="gym-preview" class="hotel-menu" aria-labelledby="gym-title">
    <header class="hotel-menu-header">
      <h2 id="gym-title">6 – Posilovna</h2>
      <form method="dialog"><button class="hotel-menu-close" aria-label="Zavřít">×</button></form>
    </header>
    <div class="hotel-menu-content">
      <p>Tlačítko 6 je v panelu. Posilovna se připravuje.</p>
      <a class="hotel-action" href="../">Hlavní obrazovka</a>
    </div>
  </dialog>
</body>
</html>
